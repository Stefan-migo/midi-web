<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIDI / materia en movimiento</title><meta name="description" content="MIDI Colectivo Artístico. Una composición en movimiento."><link rel="icon" href="/assets/favicon.svg"><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="/src/styles/style.css"></head>
<body>
<main id="world" data-scene="0">
<div id="composition">
<div id="motion-art" aria-hidden="true"></div>
<svg id="hit-regions" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid meet" aria-label="Composición interactiva de MIDI"><g id="pieces"></g></svg>
</div>
<a class="signature" href="/" aria-label="MIDI inicio"><img src="/assets/midi-horizontal-blanco.svg" alt="MIDI Colectivo Artístico" width="534" height="179"></a>

<div class="scene-copy"><h1 id="scene-title">MIDI</h1><p id="scene-subtitle">materia en movimiento</p></div>

<nav aria-label="Escenas" class="scene-map"><a href="/" aria-label="Inicio" title="Inicio" aria-current="page"></a><a href="/portafolio/" aria-label="Portafolio" title="Portafolio"></a><a href="/nosotros/" aria-label="Nosotros" title="Nosotros"></a><a href="/contacto/" aria-label="Contacto" title="Contacto"></a><a href="/exploraciones/" aria-label="Exploraciones" title="Exploraciones"></a></nav>
