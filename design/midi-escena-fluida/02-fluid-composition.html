<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>02 · Fluid composition</title>
<style>
  :root{--paper:#f4f4f4;--ink:#111111;--border:#777;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--ink);color:var(--paper);font-family:var(--mono);overflow:hidden}
  .world{position:relative;height:100svh;min-height:450px;overflow:hidden;isolation:isolate}

  /* La composición se arma para la proporción real de la pantalla: no hay
     letterbox porque no hay un lienzo fijo que respetar, y no hay recorte
     porque nada se escala para cubrir. */
  .art{position:absolute;inset:0;display:grid;
    grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(4,1fr)}
  .art svg{width:100%;height:100%;display:block;padding:6px}
  .art > :nth-child(3n+1) svg{transform:scale(.72)}
  .art > :nth-child(4n+2) svg{transform:scale(1.05)}
  .art > :nth-child(5n+3) svg{transform:scale(.58)}
  .art > :nth-child(7n) svg{opacity:.35}

  .annotation{position:absolute;top:22px;left:50%;transform:translateX(-50%);z-index:4;
    font-size:10px;letter-spacing:.18em;text-transform:uppercase;padding:7px 12px;
    border:1px dashed rgba(244,244,244,.45);color:rgba(244,244,244,.75)}

  .signature{position:absolute;top:26px;left:30px;z-index:3;mix-blend-mode:difference;
    font-size:23px;line-height:1;letter-spacing:-.02em}
  .coordinates{position:absolute;top:30px;right:30px;z-index:3;font-size:11px;mix-blend-mode:difference}
  .motion{position:absolute;top:65px;right:30px;z-index:3;width:27px;height:27px;
    border:1px solid var(--border);background:none;color:inherit;font:inherit;font-size:10px;
    display:grid;place-items:center;cursor:pointer}

  .scene{position:absolute;left:5%;bottom:15%;z-index:3;mix-blend-mode:difference;pointer-events:none;
    max-width:88vw}
  .scene h1{margin:0;font-size:clamp(44px,9.2vw,150px);line-height:.88;letter-spacing:-.05em;
    font-weight:500;text-wrap:balance}
  .scene p{margin:16px 0 0;font-size:clamp(12px,1.1vw,15px);letter-spacing:.16em;text-transform:uppercase}

  .whisper{position:absolute;left:30px;bottom:29px;z-index:3;font-size:11px;
    letter-spacing:.06em;mix-blend-mode:difference}
  .map{position:absolute;left:50%;bottom:27px;transform:translateX(-50%);z-index:3;
    display:flex;gap:12px;mix-blend-mode:difference}
  .map a{width:12px;height:12px;border:1px solid;display:block}
  .map a[aria-current]{background:var(--paper);transform:rotate(90deg)}
  .advance{position:absolute;right:28px;bottom:20px;z-index:3;background:none;border:0;
    color:inherit;font:inherit;font-size:10px;padding:8px;cursor:pointer;mix-blend-mode:difference}
  .advance span{font-size:22px;margin-left:20px}

  a:focus-visible,button:focus-visible{outline:2px dashed currentColor;outline-offset:6px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
