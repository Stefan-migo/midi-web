<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>03 · El bloque se recompone — apertura del panel de obra</title>
<style>
  :root {
    --paper: #f4f4f4;
    --ink: #111111;
    --ease-out: cubic-bezier(.16, 1, .3, 1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ink); color: var(--paper);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    overflow: hidden;
  }
  #board { position: relative; height: 100svh; min-height: 620px; overflow: hidden; }

  .hud { position: absolute; z-index: 4; display: flex; gap: 22px; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; }
  .hud--top { top: 26px; left: 30px; }
  .hud b { font-weight: 500; }
  .hud .dim { opacity: .6; }

  .piece {
    position: absolute; background: var(--paper); color: var(--ink);
    border: 0; padding: 0; cursor: crosshair; font: inherit; font-size: 11px;
    letter-spacing: .12em; text-transform: uppercase;
    display: flex; align-items: flex-end; z-index: 2;
    transition: opacity .22s ease;
  }
  .piece > span { padding: 0 10px 8px; opacity: 0; transition: opacity .24s ease; }
  .piece:hover > span, .piece:focus-visible > span { opacity: 1; }
  .piece:focus-visible { outline: 2px dashed var(--paper); outline-offset: 6px; }
  .piece--faded { opacity: .16; }
  /* The block that opened steps aside: its rectangles are now the frame. */
  .piece--lifted { opacity: 0; }
  #p1 { left: 6%;  top: 24%; width: 28%; height: 100px; }
  #p2 { left: 38%; top: 24%; width: 56%; height: 100px; }
  #p3 { left: 6%;  top: 40%; width: 24%; height: 180px; }
  #p4 { left: 34%; top: 40%; width: 26%; height: 180px; }
  #p5 { left: 64%; top: 40%; width: 30%; height: 180px; }

  /* --- the panel ---------------------------------------------------------- */
  #panel { position: absolute; z-index: 5; inset: 10% 12%; visibility: hidden; pointer-events: none; }
  #panel.is-open { visibility: visible; pointer-events: auto; }

  /* Stage 1: four slices of the block fly out and flatten into the frame. */
  .edge {
    position: absolute; background: var(--paper);
    transition:
      left .5s var(--ease-out), top .5s var(--ease-out),
      width .5s var(--ease-out), height .5s var(--ease-out);
  }

  /* Stage 2: the body opens between the hairline and its 10px ink gap. */
  .body {
    position: absolute; inset: 10px; background: var(--paper); color: var(--ink);
    clip-path: inset(50% 0 50% 0);
    transition: clip-path .34s var(--ease-out);
    overflow: hidden;
  }
  .is-open .body { clip-path: inset(0 0 0 0); transition-delay: .36s; }

  .content {
    position: absolute; inset: 0;
    padding: 40px 46px 34px;
    display: grid; grid-template-rows: auto auto 1fr auto; gap: 24px;
  }
  .content > * { opacity: 0; transform: translateY(14px); }
  .is-open .content > * { opacity: 1; transform: none; transition: opacity .3s ease, transform .44s var(--ease-out); }
  .is-open .content > *:nth-child(1) { transition-delay: .52s; }
  .is-open .content > *:nth-child(2) { transition-delay: .56s; }
  .is-open .content > *:nth-child(3) { transition-delay: .62s; }
  .is-open .content > *:nth-child(4) { transition-delay: .68s; }

  .kicker { display: flex; justify-content: space-between; gap: 20px; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; }
  .kicker .rule { flex: 1; border-top: 1px solid var(--ink); transform: translateY(-4px); }
  .kicker .soon { border: 1px solid var(--ink); padding: 2px 6px; }
  h1 { margin: 0; font-weight: 400; letter-spacing: -.06em; line-height: .94; font-size: clamp(32px, 5vw, 64px); }
  .body-grid { display: grid; grid-template-columns: 1.05fr .95fr; gap: 32px; min-height: 0; }
  .body-grid p { margin: 0 0 14px; font-size: 13px; line-height: 1.85; max-width: 46ch; }
  .body-grid p:last-child { margin-bottom: 0; }
  .plate { border: 1px solid var(--ink); display: flex; flex-direction: column; min-height: 0; margin: 0; }
  .plate .shot {
    flex: 1; min-height: 110px;
    background:
      repeating-linear-gradient(45deg, rgba(17,17,17,.13) 0 1px, transparent 1px 9px),
      linear-gradient(160deg, #e0e0e0, #a8a8a8 58%, #1c1c1c);
  }
  .plate figcaption { border-top: 1px solid var(--ink); padding: 8px 10px; font-size: 9px; letter-spacing: .14em; text-transform: uppercase; opacity: .8; }
  .foot { display: flex; justify-content: space-between; align-items: baseline; gap: 20px; border-top: 1px solid var(--ink); padding-top: 14px; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; }
  .foot button { font: inherit; letter-spacing: inherit; text-transform: inherit; background: none; border: 1px solid var(--ink); padding: 10px 16px; cursor: pointer; color: var(--ink); }
  .foot button:hover { background: var(--ink); color: var(--paper); }
  .foot button:focus-visible { outline: 2px dashed var(--ink); outline-offset: 4px; }

  .hint { position: absolute; z-index: 4; bottom: 26px; right: 30px; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; opacity: .6; }

  @media (prefers-reduced-motion: reduce) {
    .edge, .body, .content > * { transition-duration: 1ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
<main id="board">
  <div class="hud hud--top">
    <span><b>03</b> · El bloque se recompone</span>
    <span class="dim">Dirección C</span>
  </div>

  <button class="piece" id="p1" data-work="midi4all"><span>MIDI4all</span></button>
  <button class="piece" id="p2" data-work="artelogia"><span>Arteología digital</span></button>
  <button class="piece" id="p3" data-work="reforma"><span>Reafirmá la Reforma</span></button>
  <button class="piece" id="p4" data-work="cadena"><span>Cadena de memorias</span></button>
  <button class="piece" id="p5" data-work="borges"><span>Borges</span></button>

  <section id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title" aria-hidden="true">
    <div class="edge" data-edge="0" aria-hidden="true"></div>
    <div class="edge" data-edge="1" aria-hidden="true"></div>
    <div class="edge" data-edge="2" aria-hidden="true"></div>
    <div class="edge" data-edge="3" aria-hidden="true"></div>
    <div class="body">
      <div class="content">
        <div class="kicker">
          <span id="panel-kicker">2026 · Noche de los Museos, CCUNC</span>
          <span class="soon" id="panel-soon">13 de noviembre</span>
          <span class="rule" aria-hidden="true"></span>
          <span id="panel-index">01 / 05</span>
        </div>
        <h1 id="panel-title">Borges o la coincidencia de los opuestos</h1>
        <div class="body-grid">
          <div id="panel-copy"></div>
          <figure class="plate">
            <div class="shot" aria-hidden="true"></div>
            <figcaption id="panel-shot">render · explanada</figcaption>
          </figure>
        </div>
        <div class="foot">
          <span id="panel-meta">Escenografía · instalación interactiva</span>
          <button id="close" type="button">Cerrar · Esc</button>
        </div>
      </div>
    </div>
  </section>

  <p class="hint">Click en un bloque · Esc para cerrar</p>
</main>

<script>
  const works = {
    midi4all: {
      kicker: '2025 · 990 Arte Club, Córdoba',
      soon: 'realizada',
      title: 'MIDI4all',
      copy: [
        'Proyecto artístico audiovisual concebido como un espacio de experimentación contemporánea y creación multidisciplinar, abierto a artistas que encuentren en MIDI4all un espacio de participación activa.',
        'En cada presentación realizamos una selección previa de piezas que sirven como punto de partida para la construcción de un paisaje sonoro en vivo: sonido, visuales, pintura y otras expresiones.',
      ],
      shot: 'foto · DSC5869.jpg',
      meta: 'Live set audiovisual',
    },
    artelogia: {
      kicker: '2025 · Noche de los Museos, CCUNC',
      soon: 'realizada',
      title: 'Arteología digital',
      copy: [
        'Visible desde el exterior a través de las ventanas del Refectorio, la instalación propone un acto de arteología: una práctica que fusiona las herramientas del arte contemporáneo con los métodos de la arqueología del patrimonio.',
        'La obra utiliza la inteligencia artificial como herramienta para excavar en la memoria histórica, y da rostro y movimiento a las labores fundacionales de la Manzana Jesuítica.',
      ],
      shot: 'foto · IMG_0728.jpg',
      meta: 'Video generativo · proyección sobre ventanas',
    },
    reforma: {
      kicker: '2026 · Centro Cultural UNC',
      soon: 'realizada',
      title: 'Reafirmá la Reforma',
      copy: [
        'El espacio del Refectorio reúne dos instalaciones que marcan el punto de unión del recorrido artístico: un collage audiovisual proyectado sobre el muro posterior y esta instalación interactiva, retroproyectada sobre la puerta del mismo.',
        'Propone el gesto simbólico de plasmar la propia firma sobre una versión digital del acta de 1918, sumando cada huella individual a un mismo documento colectivo.',
      ],
      shot: 'foto · DSC01479.jpg',
      meta: 'Instalación interactiva · retroproyección',
    },
    cadena: {
      kicker: '2025 · Noche de los Museos, CCUNC',
      soon: 'realizada',
      title: 'Cadena de memorias',
      copy: [
        'Un espacio de reflexión y homenaje a la memoria de las personas esclavizadas, cuyo trabajo forzado fue fundamental para construir y sostener el patrimonio jesuítico.',
        'Una gran máscara escultórica unida a una cadena cobra vida a través de un videomapping que proyecta expresiones, rostros y grabados de culturas originarias.',
      ],
      shot: 'foto · IMG_0796.jpg',
      meta: 'Escultura · videomapping',
    },
    borges: {
      kicker: '2026 · Noche de los Museos, CCUNC',
      soon: '13 de noviembre',
      title: 'Borges o la coincidencia de los opuestos',
      copy: [
        'Una intervención en la explanada que acompaña las microcharlas de La Botica, y un collage colectivo interactivo en el Refectorio: el público interviene la composición desde su celular.',
        'El punto de partida es la posibilidad de que elementos aparentemente opuestos se encuentren, se reflejen y se transformen.',
      ],
      shot: 'render · explanada',
      meta: 'Escenografía · instalación interactiva',
    },
  };

  const panel = document.getElementById('panel');
  const edges = [...panel.querySelectorAll('.edge')];
  const pieceEls = [...document.querySelectorAll('.piece')];
  const closeBtn = document.getElementById('close');
  let opener = null;

  function paint(work, index) {
    document.getElementById('panel-kicker').textContent = work.kicker;
    document.getElementById('panel-soon').textContent = work.soon;
    document.getElementById('panel-title').textContent = work.title;
    document.getElementById('panel-copy').innerHTML = work.copy.map((p) => `<p>${p}</p>`).join('');
    document.getElementById('panel-shot').textContent = work.shot;
    document.getElementById('panel-meta').textContent = work.meta;
    document.getElementById('panel-index').textContent = index;
  }

  // The four slices the block breaks into, relative to the panel box.
  function sliceGeometry(piece, panelRect) {
    const r = piece.getBoundingClientRect();
    const w = r.width / 4;
    return edges.map((_, i) => ({
      left: r.left - panelRect.left + i * w,
      top: r.top - panelRect.top,
      width: w,
      height: r.height,
    }));
  }

  const frame = [
    { left: 0, top: 0, width: '100%', height: 2 },
    { left: 0, top: 'calc(100% - 2px)', width: '100%', height: 2 },
    { left: 0, top: 0, width: 2, height: '100%' },
    { left: 'calc(100% - 2px)', top: 0, width: 2, height: '100%' },
  ];

  function setBox(el, box) {
    el.style.left = typeof box.left === 'number' ? box.left + 'px' : box.left;
    el.style.top = typeof box.top === 'number' ? box.top + 'px' : box.top;
    el.style.width = typeof box.width === 'number' ? box.width + 'px' : box.width;
    el.style.height = typeof box.height === 'number' ? box.height + 'px' : box.height;
  }

  function open(piece) {
    const work = works[piece.dataset.work];
    if (!work) return;
    opener = piece;
    paint(work, String(pieceEls.indexOf(piece) + 1).padStart(2, '0') + ' / 05');

    const panelRect = panel.getBoundingClientRect();
    const slices = sliceGeometry(piece, panelRect);

    // Start: the block, cut in four, still where the pointer left it.
    edges.forEach((edge, i) => {
      edge.style.transition = 'none';
      setBox(edge, slices[i]);
    });
    void panel.offsetWidth;

    // End: the same four rectangles, flattened into the hairline frame.
    edges.forEach((edge, i) => {
      edge.style.transition = '';
      edge.style.transitionDelay = (i * 40) + 'ms';
      setBox(edge, frame[i]);
    });

    panel.setAttribute('aria-hidden', 'false');
    panel.classList.add('is-open');
    pieceEls.forEach((el) => el.classList.toggle('piece--faded', el !== piece));
    piece.classList.add('piece--lifted');
    piece.setAttribute('aria-expanded', 'true');
    closeBtn.focus({ preventScroll: true });
  }

  function close() {
    if (!panel.classList.contains('is-open')) return;
    panel.classList.remove('is-open');
    panel.setAttribute('aria-hidden', 'true');
    pieceEls.forEach((el) => el.classList.remove('piece--faded'));
    if (opener) {
      const slices = sliceGeometry(opener, panel.getBoundingClientRect());
      edges.forEach((edge, i) => {
        edge.style.transitionDelay = ((3 - i) * 34) + 'ms';
        setBox(edge, slices[i]);
      });
      opener.classList.remove('piece--lifted');
      opener.setAttribute('aria-expanded', 'false');
      opener.focus({ preventScroll: true });
    }
    const onEnd = (event) => {
      if (event.propertyName !== 'width') return;
      panel.style.visibility = 'hidden';
      panel.removeEventListener('transitionend', onEnd);
    };
    panel.addEventListener('transitionend', onEnd);
    panel.style.visibility = 'visible';
  }

  pieceEls.forEach((piece) => {
    piece.setAttribute('aria-expanded', 'false');
    piece.addEventListener('click', () => open(piece));
  });
  closeBtn.addEventListener('click', close);
  addEventListener('keydown', (event) => { if (event.key === 'Escape') close(); });
</script>
</body>
</html>
